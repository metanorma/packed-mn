# =============================================================================
# versions.yaml — the single source of truth for every byte packed-mn
# assembles (spec 00 §10: one owner; everything else flows from here).
#
# packed-mn compiles nothing: every input is a published, sha256-pinned
# release artifact. Bumping ANY input is a one-line edit of this file
# (the release trigger flow writes it; the workflow reads it; nothing
# else in the repo hardcodes a version or a digest).
#
# Grammar (schema_version 1):
#   tebako.version / .release   — the tamatebako/tebako toolchain release
#   tebako.sha256.<tool>.<tool-platform>   — digest of the release asset
#       <tool>-<version>.<tool-platform>[.exe]; tool platforms:
#       macos-arm64, linux-gnu-x86_64, windows-ucrt64
#   runtime                       — the tebako-runtime-ruby line the
#       package resolves at first run (lean: downloaded once per machine,
#       sha256-verified against the release's own manifest/SHA256SUMS.txt)
#   runtime.sha256.<asset-kind>.<tool-platform> — the exe / env-image /
#       windows dll digests (the resolution anchor; also the future fat
#       composition's slot pins)
#   payloads[]                    — the .tfs slices, keyed by FEEDSTOCK
#       triplet (aarch64-macos, x86_64-linux-gnu, x86_64-windows-ucrt)
#       with the release tag + asset file name + sha256 mirrored from the
#       feedstock's tpkg-registry.yaml (the registries are the upstream
#       SSOT for these digests — this file mirrors them by value).
# =============================================================================

