  - {name: w2a, slot: 0, entrypoint: /bin/w2a, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: w2m, slot: 0, entrypoint: /bin/w2m, runtime_ref: "@@RUNTIME_REF@@"}
  # --- declared-but-inactive in L1 (active: false): still argv0-
  # dispatchable here — the distributor chooses what to lay down
  - {name: cabriolet, slot: 0, entrypoint: /bin/cabriolet, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: console, slot: 0, entrypoint: /bin/console, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: convert2oscalyaml.rb, slot: 0, entrypoint: /bin/convert2oscalyaml.rb, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: dot2ruby, slot: 0, entrypoint: /bin/dot2ruby, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ea, slot: 0, entrypoint: /bin/ea, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ebnf, slot: 0, entrypoint: /bin/ebnf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: emf, slot: 0, entrypoint: /bin/emf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: emfsvg, slot: 0, entrypoint: /bin/emfsvg, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: excavate, slot: 0, entrypoint: /bin/excavate, runtime_ref: "@@RUNTIME_REF@@"}
