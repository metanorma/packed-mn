  - {name: ukiryu, slot: 0, entrypoint: /bin/ukiryu, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: unibuf, slot: 0, entrypoint: /bin/unibuf, runtime_ref: "@@RUNTIME_REF@@"}
