# =============================================================================
# package-manifest.yaml — the L2 package manifest template (spec 03 §6),
# embedded as tpkg extension block type 2 by `tebako-pkg bundle`.
#
# The workflow renders this template per leg (tools/render-manifest):
#   @@VERSION@@        — the package (payload) version, from versions.yaml
#   @@CREATED@@        — the press timestamp (RFC 3339)
#   @@RUNTIME_REF@@    — ruby@<ruby>;tebako=<line>;image (versions.yaml)
#   @@RUNTIME_ROOT@@   — the runtime root's DECLARED spelling (spec 17 §1):
#                        /__tfs__ on POSIX, /t on windows (the driver
#                        re-qualifies it onto the VFS drive, A:/t)
#   @@RUNTIME_RUBY@@   — the ruby lang version (lock.runtime.version)
#   @@MN_SHA256@@ / @@INK_VERSION@@ / @@INK_SHA256@@ — the carried slice
#                        pins (lock.slices[])
#   @@JDK_LANG@@ / @@JDK_TEBAKO@@ / @@JDK_EXE_SHA256@@ /
#   @@JDK_IMAGE_SHA256@@ — the spawned java runtime's identity + pair pins
#                        (lock.spawned[], spec 23 §13.6 / spec 30 §2)
#
# The spec-18 contract declaration (contract_era / pressed_by /
# reader_era) is NOT authored here — `tebako-pkg bundle` injects it
# (tpkg ext.rs: the block payload is the composition view + the current
# contract card).
#
# Composition (spec 30 era): slot 0 is the metanorma app slice,
# union-mounted over the env image at the runtime root (precedence
# after-env — the env image is always the lowest member). Slots 1–2 are
# the carried java RUNTIME pair (exe + env image): claimed by
# lock.spawned[], recorded with EMPTY mount points (tebako-pkg bundle
# --exact-mounts), staged into the machine runtime cache by the bootstrap
# at dispatch, and NEVER co-mounted (spec 30 §1) — the JVM runs as a
# spawned child process dispatched from the store. Slot 3 is the inkscape
# toolkit slice, exclusive at the consumer-declared /opt/inkscape. No
# `jail:` block — the package requests nothing (v1 parity: the open
# policy, spec 23 §5's never_denies).
#
# The `lock:` block (spec 23 §4/§13) records the press resolution: the
# lean runtime row (carry: false — first-run resolution rides the spec 05
# chain), the two carried slices with digest pins, and the spawned java
# edge mirrored from the payload's L1 `requires[].kind: runtime` (engine /
# constraint / expose verbatim — tebako-pkg validate cross-checks BOTH
# directions, fail 65 on drift).
#
# entries[] mirrors the payload's COMPLETE declared command inventory
# (spec 03 §6 lockstep — tebako-pkg validate cross-checks L1<->L2,
# tebako#494): argv0 dispatch can reach every declared command, and the
# distributor picks which exe names to lay down (chocolatey hardlinks
# fontist.exe; argv0 integrity admits real links/copies only — a wrapper
# generator would break argv0 selection). L1's per-entrypoint `active`
# governs MANAGED-mode install only; it has no L2 reading.
# =============================================================================

schema_version: 1
package:
  name: metanorma
  version: "@@VERSION@@"
  producer:
    tool: packed-mn
    tool_version: "2"
  created: "@@CREATED@@"
entries:
  # `entrypoint` is the mount-relative in-image PATH (the payload's
  # PROVIDES entrypoint path), never the bare command name: the bootstrap
  # passes the value verbatim as --tebako-entry and the driver resolves it
  # against the first image mount; a bare name with no '/' is the
  # interpreter keyword (spec 17 §1) and would boot a bare ruby.
  - {name: metanorma, slot: 0, entrypoint: /bin/metanorma, runtime_ref: "@@RUNTIME_REF@@"}
  # --- the active set (L1 default PATH exposure), same slot/ref
  - {name: metanorma-manifest, slot: 0, entrypoint: /bin/metanorma-manifest, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: asciidoctor, slot: 0, entrypoint: /bin/asciidoctor, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: canon, slot: 0, entrypoint: /bin/canon, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: coradoc, slot: 0, entrypoint: /bin/coradoc, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: expressir, slot: 0, entrypoint: /bin/expressir, runtime_ref: "@@RUNTIME_REF@@"}
  # the chocolatey OIML leg's packaged answer (chocolatey-metanorma#89)
  - {name: fontist, slot: 0, entrypoint: /bin/fontist, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: fontisan, slot: 0, entrypoint: /bin/fontisan, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: glossarist, slot: 0, entrypoint: /bin/glossarist, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml, slot: 0, entrypoint: /bin/lutaml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml-model, slot: 0, entrypoint: /bin/lutaml-model, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml-sysml, slot: 0, entrypoint: /bin/lutaml-sysml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml-wsd2uml, slot: 0, entrypoint: /bin/lutaml-wsd2uml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml-xsd, slot: 0, entrypoint: /bin/lutaml-xsd, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: lutaml-yaml2uml, slot: 0, entrypoint: /bin/lutaml-yaml2uml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: omnizip, slot: 0, entrypoint: /bin/omnizip, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: plurimath, slot: 0, entrypoint: /bin/plurimath, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: png_conform, slot: 0, entrypoint: /bin/png_conform, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: relaton, slot: 0, entrypoint: /bin/relaton, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: reverse_adoc, slot: 0, entrypoint: /bin/reverse_adoc, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: suma, slot: 0, entrypoint: /bin/suma, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: svg_conform, slot: 0, entrypoint: /bin/svg_conform, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: unitsdb, slot: 0, entrypoint: /bin/unitsdb, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: vectory, slot: 0, entrypoint: /bin/vectory, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: w2a, slot: 0, entrypoint: /bin/w2a, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: w2m, slot: 0, entrypoint: /bin/w2m, runtime_ref: "@@RUNTIME_REF@@"}
  # --- declared-but-inactive in L1 (active: false): still argv0-
  # dispatchable here — the distributor chooses what to lay down
  - {name: cabriolet, slot: 0, entrypoint: /bin/cabriolet, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: console, slot: 0, entrypoint: /bin/console, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: convert2oscalyaml.rb, slot: 0, entrypoint: /bin/convert2oscalyaml.rb, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: dot2ruby, slot: 0, entrypoint: /bin/dot2ruby, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ea, slot: 0, entrypoint: /bin/ea, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ebnf, slot: 0, entrypoint: /bin/ebnf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: emf, slot: 0, entrypoint: /bin/emf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: emfsvg, slot: 0, entrypoint: /bin/emfsvg, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: excavate, slot: 0, entrypoint: /bin/excavate, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: fractor, slot: 0, entrypoint: /bin/fractor, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: fuzzy_match, slot: 0, entrypoint: /bin/fuzzy_match, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: gem2gv, slot: 0, entrypoint: /bin/gem2gv, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: git2gv, slot: 0, entrypoint: /bin/git2gv, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: japanese_calendar, slot: 0, entrypoint: /bin/japanese_calendar, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: jsonld, slot: 0, entrypoint: /bin/jsonld, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ldiff, slot: 0, entrypoint: /bin/ldiff, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: loc-mods, slot: 0, entrypoint: /bin/loc-mods, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: nokogiri, slot: 0, entrypoint: /bin/nokogiri, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: premailer, slot: 0, entrypoint: /bin/premailer, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: pubid-nist, slot: 0, entrypoint: /bin/pubid-nist, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: rdf, slot: 0, entrypoint: /bin/rdf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: reverse_markdown, slot: 0, entrypoint: /bin/reverse_markdown, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: rng, slot: 0, entrypoint: /bin/rng, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: rougify, slot: 0, entrypoint: /bin/rougify, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ruby-ll, slot: 0, entrypoint: /bin/ruby-ll, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ruby2gv, slot: 0, entrypoint: /bin/ruby2gv, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: setup, slot: 0, entrypoint: /bin/setup, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: socksify_ruby, slot: 0, entrypoint: /bin/socksify_ruby, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: sparql, slot: 0, entrypoint: /bin/sparql, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: sxp2json, slot: 0, entrypoint: /bin/sxp2json, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: sxp2rdf, slot: 0, entrypoint: /bin/sxp2rdf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: sxp2xml, slot: 0, entrypoint: /bin/sxp2xml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: sxp2yaml, slot: 0, entrypoint: /bin/sxp2yaml, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: thor, slot: 0, entrypoint: /bin/thor, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: tokenize, slot: 0, entrypoint: /bin/tokenize, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: ukiryu, slot: 0, entrypoint: /bin/ukiryu, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: unibuf, slot: 0, entrypoint: /bin/unibuf, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: w3c_api, slot: 0, entrypoint: /bin/w3c_api, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: xml2gv, slot: 0, entrypoint: /bin/xml2gv, runtime_ref: "@@RUNTIME_REF@@"}
  - {name: xsdvi, slot: 0, entrypoint: /bin/xsdvi, runtime_ref: "@@RUNTIME_REF@@"}
lock:
  # spec 23 §4/§13 — the press resolution record. Runtime: LEAN (the
  # first run resolves the ruby pair via the spec 05 chain; only the
  # lang version is recorded, spec 23 §13.4). Slices: the two carried
  # toolkit/app images with their digest pins. Spawned: the java edge,
  # mirrored verbatim from the payload's L1 requires[].kind: runtime
  # (spec 30 §2 — validate cross-checks engine/constraint/expose BOTH
  # directions); the carried pair rides slots 1–2 with EMPTY mount
  # points, claimed here, staged into the machine runtime cache at
  # dispatch, TEBAKO_SPAWN_LOCK exported to the driver.
  runtime:
    version: "@@RUNTIME_RUBY@@"
    carry: false
  slices:
    - {name: metanorma, version: "@@VERSION@@", carry: true, slot: 0, mount: "@@RUNTIME_ROOT@@", sha256: "@@MN_SHA256@@"}
    - {name: inkscape, version: "@@INK_VERSION@@", carry: true, slot: 3, mount: /opt/inkscape, sha256: "@@INK_SHA256@@"}
  spawned:
    - engine: java
      constraint: ">= 21, < 26"
      expose: [java]
      version: "@@JDK_LANG@@"
      tebako: "@@JDK_TEBAKO@@"
      carry: true
      exe: {slot: 1, sha256: "@@JDK_EXE_SHA256@@"}
      image: {slot: 2, sha256: "@@JDK_IMAGE_SHA256@@"}
mounts:
  - slot: 0
    point: "@@RUNTIME_ROOT@@"
    mode: union
    precedence: after-env
  # slots 1–2 (the spawned java pair) carry NO mount — claimed by
  # lock.spawned[], never mounted (spec 30 §1)
  - slot: 3
    point: /opt/inkscape
